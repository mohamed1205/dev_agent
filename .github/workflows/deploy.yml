# Deploys the orchestrators' code (composer-dev) after each merge to main:
# dev, in that order, each environment after the one before it succeeds.
#
# Proposed by the platform agents' CI/CD agent; a person reviews and commits it. It holds no location,
# account or credential: each job reads them from its environment's variables, and signs in with OIDC,
# so no key is stored anywhere. Protect the last environment with required reviewers.
name: deploy

on:
  push:
    branches: [main]
    paths: ["bigquery_tables/migrations/**", "dags/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Sign in with OIDC (no stored key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      - name: Apply the table migrations in bigquery_tables/
        env:
          FLYWAY_URL: ${{ vars.FLYWAY_URL }}
          FLYWAY_SCHEMA: ${{ vars.FLYWAY_SCHEMA }}
          FLYWAY_DRIVER_URL: ${{ vars.FLYWAY_DRIVER_URL }}
          FLYWAY_DRIVER_SHA256: ${{ vars.FLYWAY_DRIVER_SHA256 }}
        run: |
          drivers="$PWD/.flyway-drivers"
          mkdir -p "$drivers"
          curl -fsSL "${FLYWAY_DRIVER_URL}" -o "$drivers/driver.zip"
          echo "${FLYWAY_DRIVER_SHA256}  $drivers/driver.zip" | sha256sum -c -
          unzip -q -o "$drivers/driver.zip" -d "$drivers"
          token="$(gcloud auth print-access-token)"; echo "::add-mask::${token}"
          docker run --rm -v "$PWD:/flyway/project" -v "$drivers:/flyway/jars" -w /flyway/project -e FLYWAY_URL="${FLYWAY_URL};OAuthAccessToken=${token}" -e GOOGLE_APPLICATION_CREDENTIALS="/flyway/project/${GOOGLE_APPLICATION_CREDENTIALS#"$PWD"/}" redgate/flyway:12.6.1@sha256:5614562aac1f8a814b35a00a0b344d669d6435eb870f4f0d485e6ad8161f8302 -locations=filesystem:bigquery_tables/migrations -defaultSchema="${FLYWAY_SCHEMA}" -batch=true migrate
      - name: Copy dags/
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: gcloud storage rsync --recursive --delete-unmatched-destination-objects --exclude="airflow_monitoring\.py" dags "gs://${DEPLOY_PATH}"
