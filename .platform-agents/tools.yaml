# Instances: which of your tool environments the platform agents work with. Change it through a normal PR.
#
# One instance per tool and environment. What the agents may do with each tool comes from its tool
# pack in the product; here you only say where it is. Fill in every REPLACE_WITH_ value, then set
# `enabled: true`. `pa check validate` (and the checks workflow) checks this file.
#
#   name          unique id (lowercase, digits, hyphens); used in branch names, labels and policies/<name>/
#   tool          the tool pack
#   enabled       false = no agent uses this instance
#   agents        which agents use it: error-triage and/or pipeline-builder
#   account       where it lives, as its platform names it (see the comment on each)
#   params        the tool pack's settings
#   filter_extra  optional, error-triage only: appended to the tool's error filter to silence known noise

instances:
  - name: composer-dev
    tool: composer
    enabled: true
    agents: [error-triage, pipeline-builder, governance, cicd]
    account: atlantean-land-415108 # GCP project ID
    params:
      environment: composer-agent # Composer environment name
      location: us-central1 # the environment's region
      airflow_version: 2.11.1 # Airflow version the environment runs. CI installs it to test that DAGs import.
      # repo_path: ...  # optional (default dags): folder in the dev repo that holds this environment's DAGs (deployed to its DAG bucket)
      # ci_packages: ...  # optional: extra PyPI packages your DAGs import (usually the environment's PyPI packages), installed for the DAG import test
  - name: bigquery-dev
    tool: bigquery
    enabled: true
    agents: [pipeline-builder, governance, cicd]
    account: atlantean-land-415108 # GCP project ID
    params:
      location: US # where the datasets live. Jobs must run in the same location.
      datasets: [dev_raw] # the datasets pipelines may read from or write to (a list). The pipeline checks reject code that names any other dataset.
  - name: gcs-dev
    tool: gcs
    enabled: true
    agents: [pipeline-builder, governance]
    account: atlantean-land-415108 # GCP project ID
    params:
      buckets: [atlantean-land-415108-dev-data] # the buckets pipelines may read from or write to (a list). The pipeline checks reject code that names any other bucket.
  - name: script-dev
    tool: script
    enabled: true
    agents: [cicd]
    params:
      files: [deploy/deploy_dags.sh] # the deployment files, as paths or globs from the repo root (a list), e.g. [deploy/deploy.sh, Makefile]
      deploys: {composer-dev: 'gs://us-central1-composer-agent-76861d07-bucket/dags'} # which orchestrator instances these files deploy, and where each one's code goes (a map), e.g. {my-orchestrator: "<where its code is copied to>"}
  - name: dataplex-dev
    tool: dataplex
    enabled: true
    agents: [governance, error-triage]
    account: atlantean-land-415108 # GCP project ID
    params:
      locations: [us-central1] # the regions with the project's data quality scans and its tables' catalog entries (a list), e.g. [europe-west1]
      # lineage_locations: ...  # optional (default []): where the catalog's lineage is kept (a list), e.g. [eu]. The detector needs roles/datalineage.viewer. Leave it empty to use only the repo's lineage.
      # glossary_locations: ...  # optional (default ['global']): where the business glossaries are (a list)
      # quality_lookback_days: ...  # optional (default 7): how many days back the quality scans' results are read

      lineage_locations:
        - us
  - name: sdp-dev
    tool: sdp
    enabled: true
    agents: [governance, error-triage]
    account: atlantean-land-415108 # GCP project ID
    params:
      locations: [global] # where discovery keeps its data profiles (a list), e.g. [global] or [europe-west1]
  - name: flyway-dev
    tool: flyway
    enabled: true
    agents: [cicd]
    params:
      warehouse: bigquery-dev # the warehouse instance whose tables these are (its name in this file), e.g. my-warehouse
      # dir: ...  # optional: the folder holding the table definitions and migrations/ (default: the warehouse pack's tables_dir, e.g. bigquery_tables for BigQuery)
      # history_schema: ...  # optional: the dataset or schema where Flyway keeps flyway_schema_history (Flyway's defaultSchema); for the suggested flyway.toml

      history_schema: dev_raw
  - name: redshift-dev
    tool: redshift
    enabled: true
    agents: [pipeline-builder, governance, cicd]
    account: "897729105732" # AWS account ID
    params:
      warehouse: default-workgroup # Redshift Serverless workgroup name
      serverless: true
      database: dev
      schemas: [stg_finance, finance]
