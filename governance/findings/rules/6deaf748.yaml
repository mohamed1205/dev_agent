# Governance finding: nothing stops a null customer_id reaching crm.customer_orders.
# Written by the governance agent from code and metadata only. Nothing here has been applied.
id: "6deaf748"
kind: rule_unmet
group: rules
created_at: "2026-10-30T17:16:00Z"
summary: >-
  Pipeline crm-orders-export-daily doesn't guarantee that customer_id is never null in
  atlantean-land-415108.crm.customer_orders. A null customer_id in the source files passes the load and
  the MERGE unchecked, and the deduplication even prefers a row whose customer_id is null.
subject:
  rule: customer-orders-customer-id-not-null
  pipeline: crm-orders-export-daily
  resource: atlantean-land-415108.crm.customer_orders
  account: atlantean-land-415108
  tools: [bigquery, composer]
evidence:
  - check: "business_logic.md, line 26"
    result: "\"customer_id is never null in crm.customer_orders\""
  - check: "dags/crm_orders_export_daily.py, line 66 (load_files)"
    result: "schema_fields gives customer_id no mode, so it's NULLABLE: the load enforces nothing."
  - check: "dags/sql/crm_orders_export_daily/merge_customer_orders.sql, lines 4 and 8-10"
    result: >-
      customer_id passes through SELECT * EXCEPT (...) from the nullable raw column. The WHERE filters
      order_id and amount, but not customer_id.
  - check: "dags/sql/crm_orders_export_daily/merge_customer_orders.sql, line 11"
    result: >-
      QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY customer_id) = 1. BigQuery sorts NULL
      first in ascending order, so of two copies of an order, one without a customer_id, the copy with
      the null is kept.
  - check: "dags/sql/crm_orders_export_daily/merge_customer_orders.sql, line 15"
    result: "WHEN MATCHED ... UPDATE SET customer_id = s.customer_id can overwrite a known customer_id with a null."
  - check: "bigquery_tables/crm/customer_orders.sql, line 3, and the live schema (.agent-tmp/governance/raw/instances/bigquery-dev/schema.json)"
    result: "customer_id STRING, mode NULLABLE in gold."
  - check: "dags/crm_orders_export_daily.py, line 86 (check_rows)"
    result: "The only check tests that the run wrote at least one row; it doesn't look at customer_id."
  - check: ".agent-tmp/governance/raw/instances/dataplex-dev/quality.json"
    result: "No Dataplex data quality scan or check covers crm.customer_orders (scans and checks are empty)."
risk:
  level: medium
  why: >-
    Orders without a customer can reach the gold table that reports use, and an update can even replace a
    known customer with a null. Whether the source files ever leave customer_id empty can't be known
    without the data; nothing in the code prevents it. Existing gold rows aren't covered by the fix: a
    person with data access can check whether any have a null customer_id.
proposal: fix_pipeline
remediation:
  summary: >-
    Filter out rows without a customer_id before the deduplication, as is already done for order_id. The
    filter sits before QUALIFY, so a duplicate order keeps the copy that has a customer_id.
  suggested_change: |
    --- a/dags/sql/crm_orders_export_daily/merge_customer_orders.sql
    +++ b/dags/sql/crm_orders_export_daily/merge_customer_orders.sql
    @@ -7,5 +7,6 @@
       FROM `atlantean-land-415108.raw_crm.customer_orders`
       WHERE _PARTITIONDATE = '{{ ds }}'
         AND order_id IS NOT NULL
    +    AND customer_id IS NOT NULL
         AND SAFE_CAST(amount AS NUMERIC) >= 0
       QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY customer_id) = 1
  manual_steps:
    - >-
      Open a Pipeline request for crm-orders-export-daily that quotes the rule ("customer_id is never null
      in crm.customer_orders") and this finding (governance/findings/rules/6deaf748.yaml), asking for the
      change above. The pipeline builder makes the change in a PR; review and merge it there.
    - >-
      A person with data access checks whether gold already holds rows with a null customer_id, and decides
      with the data owner what to do with them. The governance agent can't read data and doesn't.
  next_step: >-
    Open a Pipeline request for crm-orders-export-daily that quotes the rule
    customer-orders-customer-id-not-null and this finding (6deaf748).
alternatives:
  - >-
    If an order with no customer_id should stop the run rather than be dropped quietly, ask instead for a
    check step after merge_customer_orders (a BigQueryCheckOperator with
    SELECT COUNTIF(customer_id IS NULL) = 0 FROM `atlantean-land-415108.crm.customer_orders`
    WHERE _load_id = '{{ run_id }}'), placed before export_orders. A check after the gold write fails the
    run but doesn't undo the write, so the WHERE filter is the stronger guarantee.
  - >-
    BigQuery can't add NOT NULL to an existing column (ALTER COLUMN only drops it), so the DDL alone can't
    enforce this rule without recreating the table.
history:
  - at: "2026-10-30T17:16:00Z"
    note: "Raised by the daily governance run (rules)."
