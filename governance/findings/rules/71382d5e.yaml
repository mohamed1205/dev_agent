# Governance finding: nothing stops an amount above 100000 reaching crm.customer_orders.
# Written by the governance agent from code and metadata only. Nothing here has been applied.
id: "71382d5e"
kind: rule_unmet
group: rules
created_at: "2026-10-30T17:16:00Z"
summary: >-
  Pipeline crm-orders-export-daily filters negative amounts but sets no upper bound, so an amount above
  100000 reaches atlantean-land-415108.crm.customer_orders. The rule's own example, an order with amount
  250000.00, would be kept instead of rejected.
subject:
  rule: customer-orders-amount-max
  pipeline: crm-orders-export-daily
  resource: atlantean-land-415108.crm.customer_orders
  account: atlantean-land-415108
  tools: [bigquery, composer]
evidence:
  - check: "business_logic.md, lines 29-30"
    result: "\"amount is at most 100000 in crm.customer_orders\", with \"Example: an order with amount 250000.00 is rejected\""
  - check: "dags/crm_orders_export_daily.py, line 72 (load_files)"
    result: "amount is loaded as STRING into raw: any value passes."
  - check: "dags/sql/crm_orders_export_daily/merge_customer_orders.sql, line 10"
    result: "The only condition on amount is SAFE_CAST(amount AS NUMERIC) >= 0. Nothing bounds it above."
  - check: "bigquery_tables/crm/customer_orders.sql, line 7, and the live schema"
    result: "amount NUMERIC, with no constraint; NUMERIC holds values far above 100000."
  - check: "dags/crm_orders_export_daily.py, line 86 (check_rows)"
    result: "The only check tests that the run wrote at least one row; it doesn't look at amount."
  - check: ".agent-tmp/governance/raw/instances/dataplex-dev/quality.json"
    result: "No Dataplex data quality scan or check covers crm.customer_orders (scans and checks are empty)."
risk:
  level: medium
  why: >-
    Order amounts above the agreed maximum can reach the gold table and the export to AWS, and distort
    totals in reports. Whether the source files ever hold such amounts can't be known without the data;
    nothing in the code prevents it.
proposal: fix_pipeline
remediation:
  summary: >-
    Bound the amount on both sides in the MERGE's filter. BETWEEN includes both ends, so it keeps 0 and
    100000, rejects the rule's examples -5.00 and 250000.00, and keeps the existing never-negative rule.
  suggested_change: |
    --- a/dags/sql/crm_orders_export_daily/merge_customer_orders.sql
    +++ b/dags/sql/crm_orders_export_daily/merge_customer_orders.sql
    @@ -8,4 +8,4 @@
       WHERE _PARTITIONDATE = '{{ ds }}'
         AND order_id IS NOT NULL
    -    AND SAFE_CAST(amount AS NUMERIC) >= 0
    +    AND SAFE_CAST(amount AS NUMERIC) BETWEEN 0 AND 100000
       QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY customer_id) = 1
  manual_steps:
    - >-
      Open a Pipeline request for crm-orders-export-daily that quotes the rule ("amount is at most 100000
      in crm.customer_orders", and its example) and this finding (governance/findings/rules/71382d5e.yaml),
      asking for the change above. The pipeline builder makes the change in a PR; review and merge it
      there.
    - >-
      A person with data access checks whether gold already holds amounts above 100000, and decides with
      the data owner what to do with them. The governance agent can't read data and doesn't.
  next_step: >-
    Open a Pipeline request for crm-orders-export-daily that quotes the rule customer-orders-amount-max
    and this finding (71382d5e).
alternatives:
  - >-
    If rejected orders must be kept for follow-up rather than dropped, ask for them to be written to a
    quarantine table in the raw or staging layer instead; the rule only requires that they don't reach
    crm.customer_orders.
  - >-
    If 100000 is meant to be exclusive ("below 100000"), say so on the PR and the rule's parameters and
    the suggested filter will be changed.
history:
  - at: "2026-10-30T17:16:00Z"
    note: "Raised by the daily governance run (rules)."
